# Nginx: recebe as visitas na porta 80/443 e repassa para o site (porta 3000).
# O instalador troca __DOMINIO__ pelo seu domínio. O HTTPS é adicionado depois pelo certbot.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # formulários do site são pequenos; nada de envios grandes
    client_max_body_size 1m;

    # textos compactados: o site abre mais rápido no celular
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
